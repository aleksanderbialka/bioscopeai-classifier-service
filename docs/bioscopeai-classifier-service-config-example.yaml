app:
  DEBUG: true
  LOG_LEVEL: "debug"
  LOG_FILE_LEVEL: "debug"
  LOG_FILE_PATH: ""
  PROJECT_NAME: "BioScopeAI Core"
  PROJECT_VERSION: "0.0.1"

sentry:
  SENTRY_DSN: ""

auth:
  ACCESS_TOKEN_TTL_MINUTES: 15  # 15 minutes
  REFRESH_TOKEN_TTL_MINUTES: 10080  # 7 days
  PUBLIC_KEY: |
    -----BEGIN PUBLIC KEY-----
    -----END PUBLIC KEY-----
  PRIVATE_KEY: |
    -----BEGIN PRIVATE KEY-----
    -----END PRIVATE KEY-----

service_auth:
  SERVICE_TOKEN: "your-service-to-service-token-here"
  CORE_API_BASE_URL: "http://bioscopeai-core:8000"

image:
  UPLOAD_DIR: ""
  ALLOWED_MIME:
    - "image/jpeg"
    - "image/png"
  ALLOWED_EXT:
    - ".jpg"
    - ".jpeg"
    - ".png"
  MAX_FILE_SIZE: 10485760  # 10 MB

kafka:
  BOOTSTRAP_SERVERS: "localhost:9092"
  CLASSIFICATION_JOBS_TOPIC: ""
  CLASSIFICATION_RESULTS_TOPIC: ""
  CLASSIFICATION_CONSUMER_GROUP: ""
  SSL_CAFILE: ""
  SSL_CERTFILE: ""
  SSL_KEYFILE: ""

ml_model:
    MODEL_PATH: ""
    IMG_SIZE: [300, 300]
    CLASS_NAMES:
      - "bone_cells_group"
      - "bone_cells_individual"
      - "other"
      - "rbc_group"
      - "rbc_individual"
      - "vascular_fragments"
